---
name: ci

"on":
    push:
        branches: [main, v2]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        env:
            OMP_NUM_THREADS: "2"
            MKL_NUM_THREADS: "2"
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - name: Install
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install torch==2.5.1 torchvision --index-url https://download.pytorch.org/whl/cpu
                  python -m pip install -e ".[dev]"
            - name: Lint
              run: ruff check .
            - name: Test
              run: python -m pytest tests -m "not gpu and not network"
